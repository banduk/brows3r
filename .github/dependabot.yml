version: 2

updates:
  # npm / pnpm (frontend)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Cargo (Rust backend)
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # keyring 4.x split the crate into a CLI binary and a separate
      # `keyring-core` library; migrating is a non-trivial refactor and is
      # tracked separately. Ignore major bumps until the migration is on the
      # roadmap. See the comment above the `keyring` dependency in
      # src-tauri/Cargo.toml.
      - dependency-name: keyring
        update-types: ["version-update:semver-major"]

  # GitHub Actions — Dependabot rewrites tags to immutable SHAs when bumping,
  # which mitigates the tag-mutation supply-chain attack pattern (e.g. the
  # tj-actions/changed-files incident, Mar 2025).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
