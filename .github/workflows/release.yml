name: Release (signed)

# ---------------------------------------------------------------------------
# Signed release pipeline. Requires the eight signing secrets documented in
# docs/contributing/release.md (Apple Developer ID certificate +
# notarisation, Windows Authenticode certificate, Tauri updater key).
#
# Tag-push trigger is intentionally DISABLED right now because the secrets
# aren't configured yet — re-enabling it without them would leave a red CI
# badge on every release. The flow today is:
#
#   release-please tags vX.Y.Z
#     → release-build.yml (unsigned) attaches artefacts to the Release
#
# Once the secrets land, uncomment the `push.tags` trigger below and decide
# whether to keep release-build.yml around for unsigned fallbacks.
# ---------------------------------------------------------------------------

on:
  # push:
  #   tags:
  #     - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)sign and publish."
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # See ci.yml for the rationale on opting into Node 24 early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ─────────────────────────────────────────────────────────────────────────────
# release-macos
#
# Builds a universal binary (.dmg) for Apple Silicon + Intel, signs the app
# bundle with the Developer ID Application certificate, and notarizes it with
# Apple's notary service before stapling and uploading to the GitHub release.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  release-macos:
    name: Release (macOS universal)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── pnpm ─────────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ── Node.js LTS ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # ── Rust stable + universal macOS targets ────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Frontend deps ─────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Apple Developer ID Application certificate ────────────────────────
      # The certificate is stored as a base64-encoded .p12 in a GitHub secret.
      # We decode it into a temporary keychain that exists only for this job.
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/brows3r-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          # Decode .p12
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Create a dedicated keychain so we don't touch the login keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Allow codesign to access the key without a UI prompt
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add to the search list so Tauri's build tooling finds the identity
          EXISTING_KEYCHAINS=$(security list-keychain -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086
          security list-keychain -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

      # ── Tauri updater signing env ─────────────────────────────────────────
      # The private key produced by `tauri signer generate` lives only in
      # GitHub secrets; never in source control.
      - name: Set Tauri updater signing environment
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: |
          echo "TAURI_UPDATER_PRIVATE_KEY=$TAURI_UPDATER_PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "TAURI_UPDATER_KEY_PASSWORD=$TAURI_UPDATER_KEY_PASSWORD" >> "$GITHUB_ENV"

      # ── Build universal .dmg ──────────────────────────────────────────────
      - name: Build universal macOS app (sign)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm tauri build --target universal-apple-darwin

      # ── Notarize .dmg ─────────────────────────────────────────────────────
      # xcrun notarytool is the modern replacement for altool.
      - name: Notarize .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "No .dmg found" >&2
            exit 1
          fi
          echo "Submitting $DMG for notarization..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      # ── Staple the notarization ticket ───────────────────────────────────
      - name: Staple notarization ticket
        run: xcrun stapler staple "$DMG_PATH"

      # ── Upload artifact to workflow run ───────────────────────────────────
      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: brows3r-macos-universal
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

      # ── Attach to GitHub release ──────────────────────────────────────────
      - name: Attach .dmg to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "$DMG_PATH" --clobber

      # ── Upload Tauri updater feed ─────────────────────────────────────────
      # Tauri generates a .sig sidecar alongside the .dmg; include it so the
      # updater feed can reference the Ed25519 signature.
      - name: Upload updater signature sidecar
        uses: actions/upload-artifact@v4
        with:
          name: brows3r-macos-universal-sig
          path: ${{ env.DMG_PATH }}.sig
          if-no-files-found: warn

      - name: Attach .sig to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIG_PATH="${DMG_PATH}.sig"
          if [ -f "$SIG_PATH" ]; then
            gh release upload "${{ github.ref_name }}" "$SIG_PATH" --clobber
          fi

      # ── Cleanup keychain ──────────────────────────────────────────────────
      - name: Remove temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/brows3r-signing.keychain-db"
          if security list-keychains | grep -q "$KEYCHAIN_PATH"; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# release-windows
#
# Builds an NSIS installer (.exe) for Windows x64, Authenticode-signs it with
# a PFX certificate stored as a GitHub secret, and uploads it to the release.
# Runs independently of the macOS job — no cross-platform dependencies.
# ─────────────────────────────────────────────────────────────────────────────
  release-windows:
    name: Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── pnpm ─────────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ── Node.js LTS ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # ── Rust stable + MSVC Windows target ────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Frontend deps ─────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Authenticode signing certificate ─────────────────────────────────
      # The PFX is stored as a base64-encoded GitHub secret. We decode it to a
      # temporary file that is cleaned up at the end of this job.
      - name: Import Authenticode signing certificate
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          $certPath  = Join-Path $env:RUNNER_TEMP "brows3r-sign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "WINDOWS_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      # ── Tauri updater signing env ─────────────────────────────────────────
      - name: Set Tauri updater signing environment
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: |
          echo "TAURI_UPDATER_PRIVATE_KEY=$env:TAURI_UPDATER_PRIVATE_KEY" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "TAURI_UPDATER_KEY_PASSWORD=$env:TAURI_UPDATER_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      # ── Build NSIS installer ──────────────────────────────────────────────
      # Tauri auto-detects Windows and produces a .exe (NSIS) installer.
      # The signCommand field in tauri.conf.json can wire signtool automatically;
      # we also run signtool explicitly below for belt-and-suspenders assurance.
      - name: Build Windows NSIS installer
        run: pnpm tauri build

      # ── Authenticode-sign the installer ──────────────────────────────────
      # signtool is available on all windows-latest runners via Windows SDK.
      # /tr uses a DigiCert RFC 3161 timestamp server so the signature stays
      # valid after the certificate expires.
      - name: Sign installer with signtool
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $exePath = Get-ChildItem `
            -Path "src-tauri\target\release\bundle\nsis" `
            -Filter "*.exe" `
            -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exePath) {
            Write-Error "No NSIS .exe found under src-tauri\target\release\bundle\nsis"
            exit 1
          }
          Write-Host "Signing $exePath"
          & signtool sign `
            /f "$env:WINDOWS_CERT_PATH" `
            /p "$env:WINDOWS_CERTIFICATE_PASSWORD" `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            /fd sha256 `
            "$exePath"
          echo "WINDOWS_EXE_PATH=$exePath" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      # ── Verify the Authenticode signature ────────────────────────────────
      - name: Verify Authenticode signature
        run: |
          & signtool verify /pa /v "$env:WINDOWS_EXE_PATH"
        shell: pwsh

      # ── Upload artifact to workflow run ───────────────────────────────────
      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: brows3r-windows-x64
          path: ${{ env.WINDOWS_EXE_PATH }}
          if-no-files-found: error

      # ── Attach to GitHub release ──────────────────────────────────────────
      - name: Attach .exe to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "$env:WINDOWS_EXE_PATH" --clobber
        shell: pwsh

      # ── Upload Tauri updater signature sidecar ────────────────────────────
      - name: Upload updater signature sidecar
        uses: actions/upload-artifact@v4
        with:
          name: brows3r-windows-x64-sig
          path: ${{ env.WINDOWS_EXE_PATH }}.sig
          if-no-files-found: warn

      - name: Attach .sig to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sigPath = "$env:WINDOWS_EXE_PATH.sig"
          if (Test-Path $sigPath) {
            gh release upload "${{ github.ref_name }}" "$sigPath" --clobber
          }
        shell: pwsh

      # ── Cleanup certificate ───────────────────────────────────────────────
      - name: Remove temporary certificate file
        if: always()
        run: |
          if (Test-Path $env:WINDOWS_CERT_PATH) {
            Remove-Item -Force $env:WINDOWS_CERT_PATH
          }
        shell: pwsh

# ─────────────────────────────────────────────────────────────────────────────
# release-linux
#
# Builds an AppImage and a .deb package for Linux x86_64, signs them with the
# Tauri updater key, and uploads both artifacts to the GitHub release.
#
# ubuntu-22.04 is pinned (rather than ubuntu-latest) because AppImage tooling
# is sensitive to glibc version: an AppImage built on an older glibc runs on
# newer distros but not the reverse.  ubuntu-22.04 provides the widest runtime
# compatibility while still shipping webkit2gtk 4.1.
# ─────────────────────────────────────────────────────────────────────────────
  release-linux:
    name: Release (Linux x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── pnpm ─────────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ── Node.js LTS ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # ── Rust stable ───────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux system dependencies ─────────────────────────────────────────
      # webkit2gtk 4.1 is required by Tauri 2.x.  libfuse2 is needed at
      # runtime by the AppImage self-mounting mechanism.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      # ── Frontend deps ─────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Tauri updater signing env ─────────────────────────────────────────
      # The private key produced by `tauri signer generate` lives only in
      # GitHub secrets; never in source control.
      - name: Set Tauri updater signing environment
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: |
          echo "TAURI_UPDATER_PRIVATE_KEY=$TAURI_UPDATER_PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "TAURI_UPDATER_KEY_PASSWORD=$TAURI_UPDATER_KEY_PASSWORD" >> "$GITHUB_ENV"

      # ── Build AppImage and .deb ───────────────────────────────────────────
      # --bundles selects only the two Linux formats we ship; omitting nsis/dmg
      # keeps the build fast and avoids installing unneeded tooling.
      - name: Build Linux AppImage and deb
        run: pnpm tauri build --bundles deb,appimage

      # ── Locate artifacts ──────────────────────────────────────────────────
      - name: Locate built artifacts
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage \
            -name "*.AppImage" | head -1)
          DEB=$(find src-tauri/target/release/bundle/deb \
            -name "*.deb" | head -1)

          if [ -z "$APPIMAGE" ]; then
            echo "No .AppImage found" >&2
            exit 1
          fi
          if [ -z "$DEB" ]; then
            echo "No .deb found" >&2
            exit 1
          fi

          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_ENV"
          echo "DEB_PATH=$DEB"          >> "$GITHUB_ENV"

      # ── Upload artifacts to workflow run ──────────────────────────────────
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: brows3r-linux-x86_64-appimage
          path: ${{ env.APPIMAGE_PATH }}
          if-no-files-found: error

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: brows3r-linux-x86_64-deb
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      # ── Attach to GitHub release ──────────────────────────────────────────
      - name: Attach AppImage to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "$APPIMAGE_PATH" --clobber

      - name: Attach deb to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "$DEB_PATH" --clobber

      # ── Upload Tauri updater signature sidecars ───────────────────────────
      # Tauri generates a .sig sidecar alongside each bundle; include them so
      # the updater feed can reference the Ed25519 signatures.
      - name: Upload AppImage updater signature sidecar
        uses: actions/upload-artifact@v4
        with:
          name: brows3r-linux-x86_64-appimage-sig
          path: ${{ env.APPIMAGE_PATH }}.sig
          if-no-files-found: warn

      - name: Attach AppImage .sig to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIG_PATH="${APPIMAGE_PATH}.sig"
          if [ -f "$SIG_PATH" ]; then
            gh release upload "${{ github.ref_name }}" "$SIG_PATH" --clobber
          fi
