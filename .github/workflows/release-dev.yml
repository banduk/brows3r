# Unsigned multi-platform build for ad-hoc testing.
#
# Triggered manually from the Actions tab (or via
# `./scripts/release-dev.sh`). Produces .dmg / .exe / .AppImage / .deb
# artifacts uploaded to the workflow run page — no tag, no release, no
# signing secrets required.
#
# When to use: you want a colleague on Windows to smoke-test a feature
# branch, or you want to sanity-check that the Linux build still produces
# a working AppImage after a dep change.
#
# When NOT to use: anything user-facing. Unsigned binaries trigger
# Gatekeeper (macOS) and SmartScreen (Windows) warnings. For real
# releases use the tagged `release.yml` flow.

name: release-dev

on:
  workflow_dispatch:
    inputs:
      include-debug:
        description: "Also build a debug variant (faster, larger)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # See ci.yml for the rationale on opting into Node 24 early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # macOS — unsigned universal binary
  # -------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build (universal, unsigned)
        run: pnpm tauri build --target universal-apple-darwin
        env:
          # Empty signing identity = unsigned build.
          APPLE_SIGNING_IDENTITY: ""

      - name: Collect artifacts
        run: |
          mkdir -p artifacts-macos
          find src-tauri/target/universal-apple-darwin/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.app" \) -exec cp -r {} artifacts-macos/ \; || true
          ls -la artifacts-macos

      - uses: actions/upload-artifact@v7
        with:
          name: brows3r-macos
          path: artifacts-macos/
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Windows — unsigned NSIS installer
  # -------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build (unsigned)
        run: pnpm tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts-windows -Force | Out-Null
          Get-ChildItem -Recurse -Path "src-tauri\target\release\bundle" -Include *.exe,*.msi |
            Copy-Item -Destination artifacts-windows
          Get-ChildItem artifacts-windows

      - uses: actions/upload-artifact@v7
        with:
          name: brows3r-windows
          path: artifacts-windows/
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Linux — AppImage + deb
  # -------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build (deb + AppImage)
        run: pnpm tauri build --bundles deb,appimage

      - name: Collect artifacts
        run: |
          mkdir -p artifacts-linux
          find src-tauri/target/release/bundle -type f \
            \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} artifacts-linux/ \;
          ls -la artifacts-linux

      - uses: actions/upload-artifact@v7
        with:
          name: brows3r-linux
          path: artifacts-linux/
          if-no-files-found: error
