name: release-please

# ---------------------------------------------------------------------------
# Two-stage release pipeline.
#
# Stage 1 — release-please (always runs on push to main)
#   - Scans conventional commits since the last tag.
#   - If there's something to release, opens/updates a "release PR".
#   - If a release PR was just merged, creates the git tag `vX.Y.Z`
#     AND the GitHub Release in one atomic API call.
#
# Stage 2 — per-OS builds (only when release-please created a release)
#   - Builds unsigned .dmg / .deb / .AppImage / .exe on the three native
#     runners.
#   - Uploads each artefact directly to the Release that release-please
#     just created.
#
# Why a single workflow rather than `release: published` + a separate
# release-build.yml?
#   GITHUB_TOKEN deliberately cannot trigger downstream workflows (an
#   anti-recursion safeguard). So a Release created here via GITHUB_TOKEN
#   does NOT fire a `release: published` event for another workflow.
#   Chaining the builds inside this same workflow via `needs:` and the
#   action's `release_created` output sidesteps the rule — everything
#   happens in one run.
#
# Maintainer's day-to-day:
#   - Commit with conventional commit prefixes (`feat:`, `fix:`, ...).
#   - When you're ready to ship, merge the open "chore: release X.Y.Z" PR.
#   - ~10–15 min later the Release page has signed-less binaries attached.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  # See ci.yml for the rationale on opting into Node 24 early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # 1. release-please — version bump PR + tag/release creation
  # -------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GITHUB_TOKEN is fine here because the downstream build jobs
          # run inside the same workflow via `needs:` (see file header).
          token: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # 2a. macOS — universal .dmg
  # -------------------------------------------------------------------------
  build-macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Reuse compiled deps across releases — cold cargo on macos-15 is the
      # slowest job in the release pipeline (~6 min). Keyed off Cargo.lock,
      # so a lockfile bump invalidates correctly. Uses `release-macos` as a
      # stable shared key separate from the `unit` cache in ci.yml since
      # the release profile differs from the debug profile compiled by CI.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-macos

      - run: pnpm install --frozen-lockfile

      # `pnpm tauri build` on macOS occasionally fails inside `bundle_dmg.sh`
      # — the script wraps `hdiutil` + Finder AppleScript and is known to
      # flake on GitHub Actions runners (Finder automation timing out, etc).
      # v0.2.4 hit this once and a re-run on the exact same runner image
      # succeeded with zero code changes. Wrap the build in a retry so a
      # single flake does not require manual re-trigger.
      - name: Build universal macOS app (retry on bundle_dmg.sh flake)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_on: error
          command: pnpm tauri build --target universal-apple-darwin

      - name: Upload .dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          shopt -s nullglob
          ARTS=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#ARTS[@]} -eq 0 ]; then
            echo "No .dmg artefacts produced" >&2
            exit 1
          fi
          gh release upload "$TAG" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # -------------------------------------------------------------------------
  # 2b. Linux — .deb + .AppImage
  # -------------------------------------------------------------------------
  build-linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      # See macOS job above — same rationale; the release-linux job has a
      # separate cache slot from CI's unit-test cache (different profile).
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-linux

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - name: Upload .deb + .AppImage to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          shopt -s nullglob
          ARTS=(
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          if [ ${#ARTS[@]} -eq 0 ]; then
            echo "No Linux artefacts produced" >&2
            exit 1
          fi
          gh release upload "$TAG" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # -------------------------------------------------------------------------
  # 2c. Windows — NSIS .exe
  # -------------------------------------------------------------------------
  build-windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      # See macOS job above — same rationale, separate slot per platform.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-windows

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - name: Upload .exe to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          shopt -s nullglob
          ARTS=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#ARTS[@]} -eq 0 ]; then
            echo "No .exe artefacts produced" >&2
            exit 1
          fi
          gh release upload "$TAG" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
