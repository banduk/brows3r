name: release-build (unsigned)

# ---------------------------------------------------------------------------
# Build unsigned .dmg / .exe / .AppImage / .deb on every GitHub Release that
# `release-please` publishes (or manual trigger via the Actions tab), and
# attach the artefacts to that Release.
#
# This is the fallback path for now: it requires no signing secrets, so the
# project ships *something* on day one. The trade-off is that users hit
# Gatekeeper / SmartScreen warnings on first launch. To upgrade to signed
# releases:
#
#   1. Configure the eight signing secrets listed in
#      docs/contributing/release.md sections 2-7.
#   2. Re-enable the existing `release.yml` workflow's `push.tags` trigger
#      (it's currently scoped to `v*.*.*` and will run alongside this one).
#   3. Delete this workflow if you no longer want unsigned artefacts on the
#      same release. Mixed signed + unsigned can confuse users — pick one.
#
# Why `release: published` instead of `push.tags`?
#   release-please creates the Release *after* the tag push, in a single
#   atomic operation. Listening to `release: published` guarantees the
#   Release exists by the time we try to upload to it — no race window.
# ---------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build for, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # macOS — unsigned universal binary
  # -------------------------------------------------------------------------
  macos:
    name: build (macos-latest, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: pnpm install --frozen-lockfile

      - name: Build universal .dmg + .app bundle
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload artefacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          shopt -s nullglob
          ARTS=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#ARTS[@]} -eq 0 ]; then
            echo "No .dmg artefacts produced" >&2
            exit 1
          fi
          gh release upload "$TAG" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # -------------------------------------------------------------------------
  # Linux — unsigned .deb + .AppImage
  # -------------------------------------------------------------------------
  linux:
    name: build (ubuntu-latest, unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Build .deb + .AppImage
        run: pnpm tauri build

      - name: Upload artefacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          shopt -s nullglob
          ARTS=(
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          if [ ${#ARTS[@]} -eq 0 ]; then
            echo "No Linux artefacts produced" >&2
            exit 1
          fi
          gh release upload "$TAG" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # -------------------------------------------------------------------------
  # Windows — unsigned NSIS .exe
  # -------------------------------------------------------------------------
  windows:
    name: build (windows-latest, unsigned)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm tauri build

      - name: Upload artefacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          shopt -s nullglob
          ARTS=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#ARTS[@]} -eq 0 ]; then
            echo "No .exe artefacts produced" >&2
            exit 1
          fi
          gh release upload "$TAG" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
