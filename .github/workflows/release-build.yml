name: release-build (manual)

# ---------------------------------------------------------------------------
# Manual fallback: rebuild and re-upload unsigned binaries for an existing
# release tag. The main release path is `release-please.yml`, which chains
# the build jobs immediately after creating the tag. This workflow exists
# for two recovery scenarios:
#
#   1. A release was created before the build-jobs were added to
#      release-please.yml (e.g. the very first release).
#   2. A build job failed (transient runner issue) and you want to retry
#      against a tag that already exists.
#
# Trigger only via the Actions tab → "release-build (manual)" → Run
# workflow → enter the existing tag (e.g. `v0.2.0`).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)build, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # See ci.yml for the rationale on opting into Node 24 early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Share the same cache slot as the automatic release-please pipeline
      # so manual re-runs do not start from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-macos
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target universal-apple-darwin
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          ARTS=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          [ ${#ARTS[@]} -gt 0 ] || { echo "no .dmg"; exit 1; }
          gh release upload "${{ inputs.tag }}" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-linux
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          ARTS=(
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          [ ${#ARTS[@]} -gt 0 ] || { echo "no linux artefacts"; exit 1; }
          gh release upload "${{ inputs.tag }}" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-windows
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          ARTS=(src-tauri/target/release/bundle/nsis/*.exe)
          [ ${#ARTS[@]} -gt 0 ] || { echo "no .exe"; exit 1; }
          gh release upload "${{ inputs.tag }}" "${ARTS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
